# Uploads a new version of one of the mod's files to Nexus Mods.
#
# Runs only when started by hand from the Actions tab. It zips the chosen
# package, takes that version's notes from CHANGELOG.md, and adds the zip as a
# new version of the matching file on the mod page.
#
# Repository settings this needs (Settings > Secrets and variables > Actions):
#   Secret    NEXUSMODS_API_KEY          from nexusmods.com/settings/api-keys
#   Variable  NEXUSMODS_MOD_ID           "Unique Mod ID" from a file's Advanced panel
#   Variable  NEXUSMODS_CORE_FILE_ID     "File ID" of the core file
#   Variable  NEXUSMODS_ADDON_FILE_ID    "File ID" of the Garage add-on file
name: Upload to Nexus Mods

on:
  workflow_dispatch:
    inputs:
      file:
        description: Which file on the mod page to update
        type: choice
        options:
          - core
          - garage-addon
        required: true
      version:
        description: Version to publish. Must have an entry in CHANGELOG.md (for example 1.2)
        type: string
        required: true
      update_mod_version:
        description: Also set the mod page's version number to this
        type: boolean
        default: true
      # Nexus can only archive through its API, and archived versions cannot be
      # downloaded. To keep the previous version available, set it to "Old files"
      # on the Nexus site afterwards.
      archive_previous:
        description: Archive this file's previous version (hides it from downloads; this is not "Old files")
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Choose the package
        id: package
        env:
          FILE: ${{ inputs.file }}
          VERSION: ${{ inputs.version }}
          MOD_ID: ${{ vars.NEXUSMODS_MOD_ID }}
          CORE_FILE_ID: ${{ vars.NEXUSMODS_CORE_FILE_ID }}
          ADDON_FILE_ID: ${{ vars.NEXUSMODS_ADDON_FILE_ID }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){1,2}$'; then
            echo "::error::Version '$VERSION' should look like 1.2 or 1.2.3"
            exit 1
          fi
          if [ -z "$MOD_ID" ]; then
            echo "::error::Repository variable NEXUSMODS_MOD_ID is not set"
            exit 1
          fi
          if [ "$FILE" = "core" ]; then
            file_id="$CORE_FILE_ID"
            id_name="NEXUSMODS_CORE_FILE_ID"
            zip_name="VehicleSmartTargeting-Core-$VERSION.zip"
            display_name="Vehicle Smart Targeting"
            description="Smart Lock and Gimbal Aim for mounted vehicle machine guns."
            category="main"
          else
            file_id="$ADDON_FILE_ID"
            id_name="NEXUSMODS_ADDON_FILE_ID"
            zip_name="VehicleSmartTargeting-GarageAddon-$VERSION.zip"
            display_name="Vehicle Smart Targeting - Garage Add-on"
            description="Optional. Sells both modes as per-vehicle upgrades through Garage. Requires the core file and Garage."
            category="optional"
          fi
          if [ -z "$file_id" ]; then
            echo "::error::Repository variable $id_name is not set"
            exit 1
          fi
          {
            echo "file_id=$file_id"
            echo "zip_name=$zip_name"
            echo "display_name=$display_name"
            echo "description=$description"
            echo "category=$category"
          } >> "$GITHUB_OUTPUT"

      # The notes players see come from CHANGELOG.md, not from commit messages.
      - name: Read the changelog entry
        id: changelog
        env:
          VERSION: ${{ inputs.version }}
        run: |
          notes="$(awk -v heading="## $VERSION" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d')"
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md has no entry under '## $VERSION'. Add one before uploading."
            exit 1
          fi
          {
            echo "notes<<VST_CHANGELOG_END"
            printf '%s\n' "$notes"
            echo "VST_CHANGELOG_END"
          } >> "$GITHUB_OUTPUT"
          echo "Changelog for $VERSION:"
          printf '%s\n' "$notes"

      # Both packages are laid out from the game root.
      - name: Build the zip
        env:
          FILE: ${{ inputs.file }}
          ZIP_NAME: ${{ steps.package.outputs.zip_name }}
        run: |
          if [ "$FILE" = "core" ]; then
            zip -r "$ZIP_NAME" r6
          else
            (cd garage-addon && zip -r "../$ZIP_NAME" bin r6)
          fi
          unzip -l "$ZIP_NAME"

      - name: Upload to Nexus Mods
        # v1.0.0-beta.10
        uses: Nexus-Mods/upload-action@c96019556046053aa26044b44396cd38929daf23
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          mod_id: ${{ vars.NEXUSMODS_MOD_ID }}
          file_id: ${{ steps.package.outputs.file_id }}
          filename: ${{ steps.package.outputs.zip_name }}
          display_name: ${{ steps.package.outputs.display_name }}
          description: ${{ steps.package.outputs.description }}
          version: ${{ inputs.version }}
          category: ${{ steps.package.outputs.category }}
          archive_existing_version: ${{ inputs.archive_previous }}
          update_mod_version: ${{ inputs.update_mod_version }}
          changelog: ${{ steps.changelog.outputs.notes }}
